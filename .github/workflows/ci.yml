name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: npm ci
      - run: npm run build:native
      - run: npm test
      - run: node scripts/test-package.mjs
