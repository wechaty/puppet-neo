name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            node-arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            node-arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin-arm64
            node-arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: win32-x64
            node-arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}
          cache: npm
      - name: Check the Node architecture
        env:
          NEO_PLATFORM: ${{ matrix.platform }}
        run: node -e "if (process.platform + '-' + process.arch !== process.env.NEO_PLATFORM) process.exit(1)"
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlDir = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlDir\perl.exe")) {
            choco install strawberryperl --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $perlDir | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm test
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: neo-native-${{ matrix.platform }}
          path: native/${{ matrix.platform }}/
          if-no-files-found: error

  package:
    name: Assemble all-platform npm tarball
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: neo-native-*
          path: native
      - name: Stage each native build
        run: |
          for addon in native/neo-native-*; do
            platform=${addon#native/neo-native-}
            mv "$addon" "native/$platform"
          done
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:package -- artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: puppet-neo-npm
          path: artifacts/*.tgz
          if-no-files-found: error
