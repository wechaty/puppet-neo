[package]
name = "puppet-neo-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wechat-protocol = "=2.1.0"

[build-dependencies]
napi-build = "2"
